[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-image-downloader"
version = "0.1.0"
description = "Fixed-area satellite imagery downloader"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
    "geopandas>=1.0,<2",
    "requests>=2.32,<3",
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
package = ["pyinstaller>=6,<7"]

[project.scripts]
satellite-downloader = "satellite_downloader.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
